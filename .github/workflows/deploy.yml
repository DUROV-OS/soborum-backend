name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
          MCP_REDIRECT_URI: ${{ secrets.MCP_REDIRECT_URI }}
          AMOCRM_MCP_URL: ${{ secrets.AMOCRM_MCP_URL }}
          AMOCRM_MCP_CLIENT_ID: ${{ secrets.AMOCRM_MCP_CLIENT_ID }}
          AMOCRM_MCP_CLIENT_SECRET: ${{ secrets.AMOCRM_MCP_CLIENT_SECRET }}
          MOYSKLAD_MCP_URL: ${{ secrets.MOYSKLAD_MCP_URL }}
          MOYSKLAD_MCP_CLIENT_ID: ${{ secrets.MOYSKLAD_MCP_CLIENT_ID }}
          MOYSKLAD_MCP_CLIENT_SECRET: ${{ secrets.MOYSKLAD_MCP_CLIENT_SECRET }}
          DASHBOARD_MCP_URL: ${{ secrets.DASHBOARD_MCP_URL }}
          DASHBOARD_MCP_CLIENT_ID: ${{ secrets.DASHBOARD_MCP_CLIENT_ID }}
          DASHBOARD_MCP_CLIENT_SECRET: ${{ secrets.DASHBOARD_MCP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          # Bundle MCP env for the server without putting secrets in git.
          python3 - <<'PY'
          import os, pathlib
          keys = [
            "MCP_SERVER_URL", "MCP_OAUTH_CLIENT_ID", "MCP_OAUTH_CLIENT_SECRET", "MCP_REDIRECT_URI",
            "AMOCRM_MCP_URL", "AMOCRM_MCP_CLIENT_ID", "AMOCRM_MCP_CLIENT_SECRET",
            "MOYSKLAD_MCP_URL", "MOYSKLAD_MCP_CLIENT_ID", "MOYSKLAD_MCP_CLIENT_SECRET",
            "DASHBOARD_MCP_URL", "DASHBOARD_MCP_CLIENT_ID", "DASHBOARD_MCP_CLIENT_SECRET",
          ]
          lines = []
          for key in keys:
              val = os.environ.get(key, "").strip()
              if val:
                  lines.append(f"{key}={val}")
          pathlib.Path("/tmp/soborbum-mcp.env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"prepared {len(lines)} mcp env keys")
          PY

          scp -i ~/.ssh/deploy_key /tmp/soborbum-mcp.env "$SSH_USER@$SSH_HOST:/tmp/soborbum-mcp.env"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" '
            set -euo pipefail
            cd /srv/soborbum-backend
            git pull
            python3 - <<'"'"'PY'"'"'
            from pathlib import Path
            root = Path("/srv/soborbum-backend")
            env_path = root / ".env"
            incoming = {}
            for line in Path("/tmp/soborbum-mcp.env").read_text(encoding="utf-8").splitlines():
                if not line.strip() or line.strip().startswith("#") or "=" not in line:
                    continue
                key, val = line.split("=", 1)
                incoming[key.strip()] = val.strip()
            existing = {}
            order = []
            if env_path.exists():
                for line in env_path.read_text(encoding="utf-8").splitlines():
                    if "=" in line and not line.strip().startswith("#"):
                        key, val = line.split("=", 1)
                        key = key.strip()
                        existing[key] = val.strip()
                        order.append(key)
                    else:
                        order.append(line)
            for key, val in incoming.items():
                if key not in existing:
                    order.append(key)
                existing[key] = val
            out = []
            seen = set()
            for item in order:
                if item in existing and item not in seen:
                    out.append(f"{item}={existing[item]}")
                    seen.add(item)
                elif item not in existing:
                    out.append(item)
            for key, val in existing.items():
                if key not in seen:
                    out.append(f"{key}={val}")
            env_path.write_text("\n".join(out) + "\n", encoding="utf-8")
            print("updated", env_path, "mcp keys", sorted(incoming))
            PY
            rm -f /tmp/soborbum-mcp.env
            docker compose up -d --build
          '
          rm -f /tmp/soborbum-mcp.env
