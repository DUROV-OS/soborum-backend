name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy verified main over restricted SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          TARGET_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          [[ "$TARGET_REVISION" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p ~/.ssh
          trap 'rm -f ~/.ssh/backend_ci_key' EXIT
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/backend_ci_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/backend_known_hosts
          ssh -T -i ~/.ssh/backend_ci_key \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/backend_known_hosts \
            -o ForwardAgent=no -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$SSH_USER@$SSH_HOST" "deploy $TARGET_REVISION"
