name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
          MCP_OAUTH_CLIENT_ID: ${{ secrets.MCP_OAUTH_CLIENT_ID }}
          MCP_OAUTH_CLIENT_SECRET: ${{ secrets.MCP_OAUTH_CLIENT_SECRET }}
          MCP_REDIRECT_URI: ${{ secrets.MCP_REDIRECT_URI }}
          AMOCRM_MCP_URL: ${{ secrets.AMOCRM_MCP_URL }}
          AMOCRM_MCP_CLIENT_ID: ${{ secrets.AMOCRM_MCP_CLIENT_ID }}
          AMOCRM_MCP_CLIENT_SECRET: ${{ secrets.AMOCRM_MCP_CLIENT_SECRET }}
          MOYSKLAD_MCP_URL: ${{ secrets.MOYSKLAD_MCP_URL }}
          MOYSKLAD_MCP_CLIENT_ID: ${{ secrets.MOYSKLAD_MCP_CLIENT_ID }}
          MOYSKLAD_MCP_CLIENT_SECRET: ${{ secrets.MOYSKLAD_MCP_CLIENT_SECRET }}
          DASHBOARD_MCP_URL: ${{ secrets.DASHBOARD_MCP_URL }}
          DASHBOARD_MCP_CLIENT_ID: ${{ secrets.DASHBOARD_MCP_CLIENT_ID }}
          DASHBOARD_MCP_CLIENT_SECRET: ${{ secrets.DASHBOARD_MCP_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

          python3 - <<'PY'
          import os, pathlib
          keys = [
            "MCP_SERVER_URL", "MCP_OAUTH_CLIENT_ID", "MCP_OAUTH_CLIENT_SECRET", "MCP_REDIRECT_URI",
            "AMOCRM_MCP_URL", "AMOCRM_MCP_CLIENT_ID", "AMOCRM_MCP_CLIENT_SECRET",
            "MOYSKLAD_MCP_URL", "MOYSKLAD_MCP_CLIENT_ID", "MOYSKLAD_MCP_CLIENT_SECRET",
            "DASHBOARD_MCP_URL", "DASHBOARD_MCP_CLIENT_ID", "DASHBOARD_MCP_CLIENT_SECRET",
          ]
          lines = [f"{key}={os.environ[key].strip()}" for key in keys if os.environ.get(key, "").strip()]
          pathlib.Path("/tmp/soborbum-mcp.env").write_text("\n".join(lines) + "\n", encoding="utf-8")
          print(f"prepared {len(lines)} mcp env keys")
          PY

          scp -i ~/.ssh/deploy_key /tmp/soborbum-mcp.env "$SSH_USER@$SSH_HOST:/tmp/soborbum-mcp.env"
          ssh -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            'cd /srv/soborbum-backend && git pull && python3 scripts/merge_env.py /tmp/soborbum-mcp.env && rm -f /tmp/soborbum-mcp.env && docker compose up -d --build'
          rm -f /tmp/soborbum-mcp.env
