services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soborbum
      POSTGRES_PASSWORD: soborbum
      POSTGRES_DB: soborbum
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soborbum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://soborbum:soborbum@db:5432/soborbum
      JWT_SECRET: change-me-in-production
      STORAGE_DIR: /app/storage
      ADMIN_EMAIL: admin@soborbum.local
      ADMIN_PASSWORD: admin123
      UVICORN_RELOAD: "1"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_REDIRECT_URI: ${MCP_REDIRECT_URI:-http://127.0.0.1:8005/callback}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:8005:8000"

volumes:
  db_data:
  storage_data:
