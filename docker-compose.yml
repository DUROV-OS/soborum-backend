services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: soborbum
      POSTGRES_PASSWORD: soborbum
      POSTGRES_DB: soborbum
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soborbum"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
      - path: .env.mcp
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg2://soborbum:soborbum@db:5432/soborbum
      STORAGE_DIR: /app/storage
      # Required. Set these in .env — no insecure defaults, prod boot fails without them.
      APP_ENV: ${APP_ENV:-prod}
      JWT_SECRET: ${JWT_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@soborbum.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # ANTHROPIC_BASE_URL is intentionally NOT set here: the anthropic SDK
      # reads it from the env directly, and an injected "" breaks every call.
      # It reaches the container via env_file (.env.mcp) only when actually set.
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-}
      MCP_OAUTH_CLIENT_ID: ${MCP_OAUTH_CLIENT_ID:-}
      MCP_OAUTH_CLIENT_SECRET: ${MCP_OAUTH_CLIENT_SECRET:-}
      MCP_REDIRECT_URI: ${MCP_REDIRECT_URI:-https://claude.ai/api/mcp/auth_callback}
      MOYSKLAD_MCP_URL: ${MOYSKLAD_MCP_URL:-}
      MOYSKLAD_MCP_CLIENT_ID: ${MOYSKLAD_MCP_CLIENT_ID:-}
      MOYSKLAD_MCP_CLIENT_SECRET: ${MOYSKLAD_MCP_CLIENT_SECRET:-}
      MOYSKLAD_TOKEN: ${MOYSKLAD_TOKEN:-}
      MAX_TOKEN: ${MAX_TOKEN:-}
      VAULT_ROOT: ${VAULT_ROOT:-}
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - storage_data:/app/storage
    ports:
      - "127.0.0.1:8005:8000"

volumes:
  db_data:
  storage_data:
